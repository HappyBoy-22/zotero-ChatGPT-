name: Validate and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: node scripts/test.cjs
      - name: Build plugin
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-reader-${{ matrix.os }}
          path: |
            dist/*.xpi
            dist/SHA256SUMS
          if-no-files-found: error
