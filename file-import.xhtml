<?xml version="1.0"?>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml" title="导入文件 — ChatGPT 论文助手" width="820" height="670">
  <script src="file-import-window.js"/>
  <html:style>
    :root{color-scheme:light dark}window{background:light-dark(#f6f8fc,#202226);color:light-dark(#202a3b,#eee);font:14px system-ui,sans-serif}
    *{box-sizing:border-box}main{display:flex;flex-direction:column;gap:18px;padding:30px;flex:1;min-height:0;overflow:auto}
    h1{font-size:25px;margin:0 0 8px}p{margin:0;line-height:1.6}.muted{color:light-dark(#647087,#b3b9c4)}
    .target{display:flex;align-items:center;gap:12px}select{flex:1;min-width:0}
    button,select{font:inherit;padding:9px 13px;border:1px solid light-dark(#d7dfe9,#535862);border-radius:7px;background:light-dark(#fff,#2b2e35);color:inherit}
    button{cursor:pointer}button:disabled,select:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid #3478f6;outline-offset:3px}
    .drop{border:2px dashed light-dark(#bdcce2,#65758e);border-radius:13px;text-align:center;padding:36px 20px;background:light-dark(#fff,#282c33)}
    .drop.active{border-color:#3478f6;background:light-dark(#eef5ff,#263954)}.drop strong{display:block;font-size:19px;margin-bottom:8px}
    .actions{display:flex;justify-content:center;gap:12px;margin-top:20px}.details{font-size:13px}.option{display:flex;gap:8px;align-items:center}input{accent-color:#3478f6}
    .status{border-radius:9px;background:light-dark(#eaf0f8,#2d3542);padding:14px 16px;min-height:75px}.progress-row{display:flex;gap:12px;align-items:center;margin-top:10px}progress{flex:1;height:10px}
    #log{white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:150px;font-size:12px;margin:8px 0 0;color:light-dark(#ac3c25,#ffa99d)}
    [hidden]{display:none!important}
  </html:style>
  <html:main>
    <html:header><html:h1>导入论文文件</html:h1><html:p class="muted">拖入文件或整个文件夹，自动保留目录层级。</html:p></html:header>
    <html:div class="target"><html:label for="destination">导入到</html:label><html:select id="destination"/></html:div>
    <html:div class="drop" id="drop-zone" tabindex="0" role="region" aria-label="文件和文件夹拖放区">
      <html:strong>将文件或文件夹拖到这里</html:strong><html:p class="muted">支持多个 PDF、EPUB 及含子文件夹的目录</html:p>
      <html:div class="actions"><html:button id="choose-files" type="button">选择文件</html:button><html:button id="choose-folder" type="button">选择文件夹</html:button></html:div>
    </html:div>
    <html:p class="muted details">文件夹会成为同名分类。内容相同的文件复用文库中的记录，并加入对应分类；同名但内容不同的文件会分别保留。原始文件保留。</html:p>
    <html:label class="option"><html:input type="checkbox" id="recognize"/>导入后按 Zotero 设置检索论文信息（需联网）</html:label>
    <html:div class="status" role="status" aria-live="polite"><html:p id="status">准备就绪，选择目标分类后即可拖入。</html:p><html:div class="progress-row" id="progress-row" hidden="hidden"><html:progress id="progress"/><html:button id="cancel" type="button">停止导入</html:button></html:div><html:pre id="log"/></html:div>
  </html:main>
</window>
